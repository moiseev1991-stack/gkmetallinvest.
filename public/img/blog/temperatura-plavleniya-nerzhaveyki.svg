<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Температура плавления нержавеющей стали — 1400–1450 °C">
	<defs>
		<linearGradient id="bgT" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#1c4b80"/>
			<stop offset=".5" stop-color="#11304f"/>
			<stop offset="1" stop-color="#0a1f3d"/>
		</linearGradient>
		<radialGradient id="glowT" cx=".82" cy=".12" r=".55">
			<stop offset="0" stop-color="#c4651b" stop-opacity=".35"/>
			<stop offset="1" stop-color="#c4651b" stop-opacity="0"/>
		</radialGradient>
		<pattern id="gridT" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M60 0H0V60" fill="none" stroke="#6c7d92" stroke-opacity=".12" stroke-width="1"/>
		</pattern>
		<linearGradient id="merc" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f0a04b"/>
			<stop offset="1" stop-color="#c4651b"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#bgT)"/>
	<rect width="1200" height="630" fill="url(#gridT)"/>
	<rect width="1200" height="630" fill="url(#glowT)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#c4651b"/>

	<!-- eyebrow tag -->
	<g transform="translate(80 74)">
		<rect x="0" y="0" width="288" height="40" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#6c7d92" stroke-opacity=".4"/>
		<circle cx="24" cy="20" r="5" fill="#c4651b"/>
		<text x="42" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#a5b1c4">ТЕМПЕРАТУРА ПЛАВЛЕНИЯ</text>
	</g>

	<!-- thermometer -->
	<g transform="translate(380 175)">
		<rect x="-17" y="0" width="34" height="185" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#9db2cd" stroke-width="2.5"/>
		<circle cx="0" cy="205" r="30" fill="#ffffff" fill-opacity=".08" stroke="#9db2cd" stroke-width="2.5"/>
		<rect x="-9" y="70" width="18" height="120" rx="9" fill="url(#merc)"/>
		<circle cx="0" cy="205" r="21" fill="url(#merc)"/>
		<!-- scale ticks -->
		<g stroke="#9db2cd" stroke-width="2" stroke-linecap="round">
			<line x1="20" y1="34" x2="34" y2="34"/>
			<line x1="20" y1="74" x2="30" y2="74"/>
			<line x1="20" y1="114" x2="34" y2="114"/>
			<line x1="20" y1="154" x2="30" y2="154"/>
		</g>
	</g>

	<!-- value -->
	<g font-family="Inter, system-ui, sans-serif">
		<text x="470" y="285" font-size="66" font-weight="800" fill="#ffffff">1400–1450</text>
		<text x="472" y="332" font-size="30" font-weight="600" fill="#f0a04b">°C — плавление</text>
	</g>

	<!-- caption -->
	<g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
		<text x="600" y="470" font-size="26" font-weight="600" fill="#e7eef7">Рабочие температуры и жаростойкость</text>
		<text x="600" y="512" font-size="19" fill="#a5b1c4">длительно до +800 °C · 310S — до +1000 °C</text>
	</g>
</svg>
