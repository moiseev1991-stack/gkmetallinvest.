name: Deploy to Timeweb

# Сборка статического Astro и заливка dist/ на Timeweb (Apache) по FTP.
# Запускается на каждый push в main и вручную (workflow_dispatch).
# Vercel продолжает деплоить параллельно — это два независимых хоста.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два деплоя одновременно — второй ждёт/отменяет первый.
concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Лимит-страховка. Первый полный залив тысяч файлов по FTP на Timeweb
    # долгий; при повторе lftp пропускает уже залитое, так что хватает с запасом.
    timeout-minutes: 55
    env:
      # Проброс секрета на уровень job, чтобы шаг деплоя можно было пропустить,
      # пока FTP-доступ ещё не добавлен в Settings → Secrets.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build

      # Заливаем через lftp: даёт таймауты (не виснет), параллельную загрузку
      # и понятный лог. Сначала быстрый пробник логина+папки — если доступ/путь
      # неверные, падаем за секунды, а не на многочасовом зависании.
      - name: Deploy to Timeweb via SFTP (SSH key)
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Авторизация по SSH-ключу (пароль главного аккаунта неизвестен,
          # доп-FTP-юзер заперт в «песочнице»). Приватный ключ кладём в файл
          # с правами 600, lftp ходит по sftp через ssh с этим ключом.
          KEYFILE="$(mktemp)"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # lftp неверно разбивает connect-program со «своими» аргументами,
          # поэтому оборачиваем ssh в скрипт: все опции и ключ зашиты внутри,
          # а host/port lftp дописывает как "$@". printf, чтобы шебанг был
          # в начале файла без YAML-отступа.
          WRAP="$(mktemp)"
          printf '#!/bin/sh\nexec ssh -a -x -v -i "%s" -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$@"\n' "$KEYFILE" > "$WRAP"
          chmod +x "$WRAP"

          # Диагностика: показать, что ssh с ключом реально логинится.
          echo "::group::ssh key self-test"
          ssh -a -x -v -i "$KEYFILE" -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$FTP_USERNAME@vh470.timeweb.ru" 'echo SSH_KEY_OK; whoami; pwd' 2>&1 | tail -40 || true
          echo "::endgroup::"

          SSH_HOST="vh470.timeweb.ru"

          echo "::group::SFTP deploy"
          lftp "sftp://$FTP_USERNAME@$SSH_HOST" -e "
            set sftp:connect-program $WRAP;
            set net:timeout 20;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 6;
            set cmd:fail-exit yes;
            pwd;
            cls -l \"$FTP_SERVER_DIR\";
            rm -f \"$FTP_SERVER_DIR/index.htm\";
            mirror -R --verbose=1 --exclude-glob .git* ./dist/ \"$FTP_SERVER_DIR\";
            echo '----- after deploy -----';
            cls -l \"$FTP_SERVER_DIR\";
            bye"
          echo "::endgroup::"

          rm -f "$KEYFILE" "$WRAP"
