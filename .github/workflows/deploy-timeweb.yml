name: Deploy to Timeweb

# Сборка статического Astro и заливка dist/ на Timeweb (Apache) по FTP.
# Запускается на каждый push в main и вручную (workflow_dispatch).
# Vercel продолжает деплоить параллельно — это два независимых хоста.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два деплоя одновременно — второй ждёт/отменяет первый.
concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Жёсткий лимит: даже при сетевых проблемах джоба не висит часами.
    timeout-minutes: 30
    env:
      # Проброс секрета на уровень job, чтобы шаг деплоя можно было пропустить,
      # пока FTP-доступ ещё не добавлен в Settings → Secrets.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build

      # Заливаем через lftp: даёт таймауты (не виснет), параллельную загрузку
      # и понятный лог. Сначала быстрый пробник логина+папки — если доступ/путь
      # неверные, падаем за секунды, а не на многочасовом зависании.
      - name: Deploy to Timeweb via FTP (lftp)
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          echo "::group::FTP probe (login + list target dir)"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set net:timeout 15
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set cmd:fail-exit yes
          debug 3
          pwd
          cls -l "$FTP_SERVER_DIR"
          bye
          EOF
          echo "::endgroup::"

          echo "::group::FTP mirror upload"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set mirror:parallel-transfer-count 4
          set cmd:fail-exit yes
          mirror -R --verbose=1 --exclude-glob .git* ./dist/ "$FTP_SERVER_DIR"
          bye
          EOF
          echo "::endgroup::"
