name: Deploy to Timeweb

# Сборка статического Astro и заливка dist/ на Timeweb (Apache) по FTP.
# Запускается на каждый push в main и вручную (workflow_dispatch).
# Vercel продолжает деплоить параллельно — это два независимых хоста.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Залить все файлы заново (игнорировать манифест прошлого деплоя)'
        type: boolean
        default: false

# Не запускать два деплоя одновременно — второй ждёт/отменяет первый.
concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Лимит-страховка. Залив тысяч файлов по SFTP на Timeweb долгий (бывает больше
    # часа, когда хостинг тормозит); при повторе lftp пропускает уже залитое.
    timeout-minutes: 150
    env:
      # Проброс секрета на уровень job, чтобы шаг деплоя можно было пропустить,
      # пока FTP-доступ ещё не добавлен в Settings → Secrets.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Клиентские ключи капчи публичные (видны в коде страницы); без них форма собирается без капчи.
      - name: Build site
        env:
          PUBLIC_RECAPTCHA_SITEKEY: ${{ secrets.RECAPTCHA_SITEKEY }}
          PUBLIC_SMARTCAPTCHA_SITEKEY: ${{ secrets.SMARTCAPTCHA_SITEKEY }}
        run: npm run build

      # Настройки отправки заявок (SMTP mail.ru, Roistat) — из секретов репозитория,
      # в git их нет. Без секрета SMTP_PASS шаг ничего не создаёт.
      - name: Write send-config.php from secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LEAD_TO: ${{ secrets.LEAD_TO }}
          ROISTAT_KEY: ${{ secrets.ROISTAT_KEY }}
          LEAD_MAIL: ${{ secrets.LEAD_MAIL }}
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          PUBLIC_RECAPTCHA_SITEKEY: ${{ secrets.RECAPTCHA_SITEKEY }}
          SMARTCAPTCHA_SERVER_KEY: ${{ secrets.SMARTCAPTCHA_SERVER_KEY }}
          PUBLIC_SMARTCAPTCHA_SITEKEY: ${{ secrets.SMARTCAPTCHA_SITEKEY }}
        run: node scripts/write-send-config.mjs

      # Заливаем через lftp: даёт таймауты (не виснет), параллельную загрузку
      # и понятный лог. Сначала быстрый пробник логина+папки — если доступ/путь
      # неверные, падаем за секунды, а не на многочасовом зависании.
      - name: Deploy to Timeweb via SFTP (SSH key)
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FULL_DEPLOY: ${{ github.event.inputs.full }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Авторизация по SSH-ключу (пароль главного аккаунта неизвестен,
          # доп-FTP-юзер заперт в «песочнице»). Приватный ключ кладём в файл
          # с правами 600, lftp ходит по sftp через ssh с этим ключом.
          KEYFILE="$(mktemp)"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # lftp неверно разбивает connect-program со «своими» аргументами,
          # поэтому оборачиваем ssh в скрипт: все опции и ключ зашиты внутри,
          # а host/port lftp дописывает как "$@". printf, чтобы шебанг был
          # в начале файла без YAML-отступа.
          # lftp не передаёт имя пользователя в connect-program, поэтому
          # жёстко фиксируем его через -o User=… (иначе ssh идёт под локальным
          # юзером runner и получает Permission denied).
          WRAP="$(mktemp)"
          printf '#!/bin/sh\nexec ssh -a -x -i "%s" -o User=%s -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$@"\n' "$KEYFILE" "$FTP_USERNAME" > "$WRAP"
          chmod +x "$WRAP"

          SSH_HOST="vh470.timeweb.ru"

          # Инкрементальный деплой: на сервере лежит .deploy-manifest.json (хэши файлов
          # прошлого успешного деплоя). Заливаем только то, что изменилось. Нет манифеста,
          # он битый или запуск вручную с галочкой «full» — заливаем всё, как раньше.
          echo "::group::Diff against previous deploy"
          rm -f prev-manifest.json
          if [ "${FULL_DEPLOY:-false}" != "true" ]; then
            lftp "sftp://$FTP_USERNAME@$SSH_HOST" -e "
              set sftp:connect-program $WRAP;
              set net:timeout 20;
              set net:max-retries 3;
              get $FTP_SERVER_DIR/.deploy-manifest.json -o prev-manifest.json;
              bye" || echo "прошлого манифеста нет — будет полная заливка"
          else
            echo "запуск с full=true — полная заливка"
          fi
          PREV=-
          if [ -s prev-manifest.json ]; then PREV=prev-manifest.json; fi
          node scripts/deploy-diff.mjs dist "$PREV" changed new-manifest.json
          echo "::endgroup::"

          # Манифест кладём в самом конце: если заливка оборвётся, останется старый,
          # и следующий деплой повторит недостающее.
          echo "::group::SFTP deploy"
          lftp "sftp://$FTP_USERNAME@$SSH_HOST" -e "
            set sftp:connect-program $WRAP;
            set net:timeout 20;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 6;
            set cmd:fail-exit yes;
            pwd;
            cls -l $FTP_SERVER_DIR;
            rm -f $FTP_SERVER_DIR/index.htm;
            mirror -R --verbose=1 --exclude-glob .git* ./changed/ $FTP_SERVER_DIR;
            put new-manifest.json -o $FTP_SERVER_DIR/.deploy-manifest.json;
            echo '----- after deploy -----';
            cls -l $FTP_SERVER_DIR;
            bye"
          echo "::endgroup::"

          rm -f "$KEYFILE" "$WRAP"

      # IndexNow: сообщаем Яндексу и Bing о страницах, изменённых в этом пуше,
      # чтобы переобошли сразу. Для сравнения нужен только прошлый коммит —
      # тянем его одного (--depth=1), историю целиком не качаем.
      # Сбой здесь деплой не валит: сайт уже залит.
      - name: Notify search engines (IndexNow)
        if: ${{ env.FTP_SERVER != '' && github.event_name == 'push' }}
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true
          node scripts/indexnow.mjs --git "${{ github.event.before }}" "${{ github.sha }}"
