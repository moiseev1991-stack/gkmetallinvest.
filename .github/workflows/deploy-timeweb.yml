name: Deploy to Timeweb

# Сборка статического Astro и заливка dist/ на Timeweb (Apache) по FTP.
# Запускается на каждый push в main и вручную (workflow_dispatch).
# Vercel продолжает деплоить параллельно — это два независимых хоста.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два деплоя одновременно — второй ждёт/отменяет первый.
concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Лимит-страховка. Первый полный залив тысяч файлов по FTP на Timeweb
    # долгий; при повторе lftp пропускает уже залитое, так что хватает с запасом.
    timeout-minutes: 55
    env:
      # Проброс секрета на уровень job, чтобы шаг деплоя можно было пропустить,
      # пока FTP-доступ ещё не добавлен в Settings → Secrets.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build

      # Заливаем через lftp: даёт таймауты (не виснет), параллельную загрузку
      # и понятный лог. Сначала быстрый пробник логина+папки — если доступ/путь
      # неверные, падаем за секунды, а не на многочасовом зависании.
      - name: Deploy to Timeweb via FTP (lftp)
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          ls_dir() {
            echo "===== cls: $1 ====="
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode on; set net:timeout 15; pwd; cls -l \"$1\"; bye" 2>&1 || echo "(failed listing $1)"
            echo
          }

          echo "::group::FTP diagnostic listing"
          ls_dir "./"
          ls_dir "/"
          ls_dir "/gkmetallinvest.ru"
          ls_dir "/gkmetallinvest.ru/public_html"
          ls_dir "/public_html"
          ls_dir "$FTP_SERVER_DIR"
          echo "::endgroup::"
